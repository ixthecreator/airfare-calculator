<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b34"><title>机票点数计算器</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173b34;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:0 auto;padding:44px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px}.eyebrow{font-size:12px;letter-spacing:2px;color:#688277}h1{font-size:30px;margin:8px 0}p{color:#62746c;line-height:1.6}.currency{background:white;padding:10px;border:1px solid #d9e1d8;border-radius:12px}select{font:inherit;border:0;background:transparent;color:inherit}nav{display:flex;gap:5px;padding:5px;background:#e6ebe2;border-radius:14px;margin-bottom:24px}button{font:inherit;cursor:pointer}nav button{flex:1;border:0;background:transparent;padding:12px 5px;border-radius:10px;color:#53665d}nav button[aria-selected=true]{background:white;color:#173b34;box-shadow:0 2px 6px #173b3410}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid #dfe5dc;border-radius:20px;padding:26px}h2{font-size:18px;margin:0 0 24px}label{display:block;font-size:14px;margin-bottom:18px}.input{display:flex;align-items:center;border:1px solid #d6dfd5;border-radius:12px;margin-top:8px;overflow:hidden}.input:focus-within{outline:2px solid #8ab29b}input{width:100%;min-width:0;padding:14px;border:0;font:inherit;font-size:21px;color:#173b34;background:transparent;outline:none}.unit{font-size:13px;white-space:nowrap;padding-right:14px;color:#74887a}.hint{font-size:12px;margin:6px 0 0}.result{background:#123b34;color:#fff;display:flex;flex-direction:column;justify-content:center}.result p{color:#bad0c3}.result h2{color:#c7d9ce;font-size:14px;margin-bottom:14px}.value{font-size:48px;letter-spacing:-2px;font-weight:650;overflow-wrap:anywhere}.sub{font-size:14px;margin:10px 0 20px}.detail{border-top:1px solid #ffffff26;padding-top:20px;font-size:14px;line-height:1.8}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:12px;color:#748478}.reset{border:0;background:none;color:#587368;padding:0;text-decoration:underline}.formula{margin-top:26px;font-size:13px}.error{color:#ffe3ac!important}button:focus-visible,select:focus-visible{outline:2px solid #729c80;outline-offset:3px}@media(max-width:640px){main{padding:28px 16px}header{align-items:flex-start}h1{font-size:25px}.layout{grid-template-columns:1fr}.panel{padding:22px}.value{font-size:42px}nav button{font-size:13px}.result{min-height:245px}.footer{flex-wrap:wrap}}
</style></head><body><main>
<header><div><div class="eyebrow">POINTS / CASH</div><h1>机票点数计算器</h1><p style="margin:0">几秒算清，一张票值多少。</p></div><label class="currency">币种 <select id="currency" aria-label="币种"><option>USD</option><option>CNY</option><option>CAD</option><option>EUR</option><option>GBP</option><option>JPY</option></select></label></header>
<nav role="tablist" aria-label="计算方式"><button role="tab" data-mode="value" aria-selected="true">算等效票价</button><button role="tab" data-mode="cpp" aria-selected="false">算兑换 CPP</button><button role="tab" data-mode="points" aria-selected="false">算所需点数</button></nav>
<div class="layout"><section class="panel"><h2 id="input-title">点数值多少钱？</h2><div id="fields"></div></section><section class="panel result" aria-live="polite" aria-atomic="true"><h2 id="result-title"></h2><div class="value" id="result">—</div><p class="sub" id="summary"></p><div class="detail" id="details"></div></section></div>
<p class="formula" id="formula"></p><div class="footer"><span id="storage">输入仅保存在当前浏览器 · 无需联网计算</span><button class="reset" id="reset">清空输入</button></div>
<p class="hint">现金票价使用含税总价；兑换税费包括兑换时另外支付的税费与附加费。CPP 表示每点对应的币种分值（金额 × 100），不自动换汇。计算未计入现金票累积的里程或其他权益。</p>
</main><script src="calculator.js"></script><script src="legacy-app.js"></script></body></html>
